; ── Configurações customizadas ────────────────────────────────────────────────

; Uploads
upload_max_filesize = 64M
post_max_size       = 64M

; Execução
max_execution_time  = 120
memory_limit        = 256M

; Timezone
date.timezone       = America/Sao_Paulo

; Erros (desativar em produção)
display_errors      = On
log_errors          = On
error_log           = /var/log/php_errors.log
