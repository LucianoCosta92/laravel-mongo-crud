services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: taskmanager_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - APP_ENV=${APP_ENV:-local}
    networks:
      - taskmanager
    depends_on:
      - mongodb
      - redis

  nginx:
    image: nginx:alpine
    container_name: taskmanager_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - taskmanager
    depends_on:
      - app

  mongodb:
    image: mongo:7
    container_name: taskmanager_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - taskmanager

  redis:
    image: redis:7-alpine
    container_name: taskmanager_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - taskmanager

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  taskmanager:
    driver: bridge
